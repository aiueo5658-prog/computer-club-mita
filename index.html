<!-- ===== 導入：ようこそ → ローディング（Tips）→ ホーム =====
     一度見せたら、二度と出さない（localStorage）。ホームのボタンを
     何度押しても、最初の一回だけでいい。
     JS が読めない・動かない環境では最初から出さず、直接ホームへ。 -->
<div class="intro" id="intro" hidden aria-hidden="true">
  <div class="stars" aria-hidden="true"></div>
  <div class="intro-stage intro-welcome" id="intro-welcome">
    <p class="intro-eyebrow">// 昆布観測島</p>
    <h1 class="intro-h">コンピュータ部へ<br>ようこそ</h1>
    <button class="cta big intro-go" id="intro-go" type="button">
      特設サイトへ
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="intro-stage intro-load" id="intro-load" hidden>
    <div class="intro-ring" aria-hidden="true"><i></i></div>
    <p class="intro-tip" id="intro-tip"></p>
    <div class="intro-bar" aria-hidden="true"><i id="intro-bar-fill"></i></div>
  </div>
</div>
<script>
/* 導入を出すのは次の2つのとき。
     1. はじめての訪問
     2. ブラウザの再読み込み（F5 など）
   サイト内のリンクで「ホーム」に戻ってきただけのときは出さない。
   毎回あの黒画面から始まると、行き来するのが煩わしくなるため。
   一方、わざわざ再読み込みするのは「もう一度最初から見たい」という
   意思表示なので、そのときは何度でも見せる。

   JS が動かない環境や localStorage が読めない環境（プライベートモード
   など）では、最初から出さずそのままいつものホームへ。 */
(function () {
  var KEY = 'ccm-intro-seen';

  /* 再読み込みかどうかを見分ける。新しい API が無いブラウザでは
     古い performance.navigation に落とす（1 が再読み込み）。 */
  var isReload = false;
  try {
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    isReload = nav ? nav.type === 'reload'
                   : !!(performance.navigation && performance.navigation.type === 1);
  } catch (e) {}

  try { if (localStorage.getItem(KEY) && !isReload) return; } catch (e) { return; }

  var intro = document.getElementById('intro');
  intro.hidden = false;
  document.body.classList.add('intro-lock');
  /* site.js はこの後に読み込まれる。星を撒く関数が届いてから使う。 */
  (function waitStars() {
    /* CCMSite が届いた直後は、まだレイアウトが整っていないことがある
       （高さが 0 で星の数が 0 になる）。少し待ってから撒く。 */
    if (!window.CCMSite) { setTimeout(waitStars, 30); return; }
    setTimeout(function () { window.CCMSite.stars(intro.querySelector('.stars'), 4242); }, 60);
  })();

  var REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* 豆知識はこれ一本だけ。読み切れる時間だけ止めてから進む。 */
  var TIP = '昆布は、コンピュータ部の略語として昔から愛されており、今もなお学校内ではコンピュータ部を昆布と呼びます。';

  var REVEAL_DELAY = 320;   /* ようこそ画面が消えて、ローディング画面が出てくるまで */
  /* 本物のダウンロードっぽく見せるため、一定速度ではなく段階ごとに
     速さを変える。はじめは勢いよく伸び、中盤で伸び悩み、最後にスッと
     100%へ決着する。ここの ms 合計がローディング画面の表示時間（約3秒）。 */
  var STAGES = [
    { to: 22,  ms: 260, ease: 'ease-out' },
    { to: 46,  ms: 420, ease: 'ease-in-out' },
    { to: 66,  ms: 520, ease: 'ease-in-out' },
    { to: 81,  ms: 640, ease: 'ease-out' },
    { to: 92,  ms: 760, ease: 'ease-out' },
    { to: 100, ms: 400, ease: 'ease-in' }
  ];
  var BAR_MS = STAGES.reduce(function (sum, s) { return sum + s.ms; }, 0);
  var HOLD_BUFFER = 200;   /* 100%になってから、次の画面へ移るまでの一呼吸 */
  var HOLD = REDUCE ? 200 : (REVEAL_DELAY + BAR_MS + HOLD_BUFFER);

  document.getElementById('intro-go').addEventListener('click', function () {
    var welcome = document.getElementById('intro-welcome');
    var load = document.getElementById('intro-load');
    welcome.classList.add('leave');
    setTimeout(function () {
      welcome.hidden = true;
      load.hidden = false;

      document.getElementById('intro-tip').textContent = TIP;
      var bar = document.getElementById('intro-bar-fill');

      if (REDUCE) {
        bar.style.transitionDuration = '0s';
        bar.style.width = '100%';
        return;
      }

      /* 直前まで hidden（display:none）だった要素は、幅を変えても
         トランジションが再生されない（描画されていないため）。
         表示された直後の2フレーム待ってから、0%を起点に段階を刻む。 */
      bar.style.transitionDuration = '0s';
      bar.style.width = '0%';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          var t = 0;
          STAGES.forEach(function (s) {
            setTimeout(function () {
              bar.style.transitionTimingFunction = s.ease;
              bar.style.transitionDuration = s.ms + 'ms';
              bar.style.width = s.to + '%';
            }, t);
            t += s.ms;
          });
        });
      });
    }, REDUCE ? 0 : REVEAL_DELAY);

    setTimeout(function () {
      intro.classList.add('out');
      document.body.classList.remove('intro-lock');
      setTimeout(function () { intro.hidden = true; }, REDUCE ? 0 : 650);
      try { localStorage.setItem(KEY, '1'); } catch (e) {}
    }, HOLD);
  });
})();
</script>

  <!-- 観測窓。部のロゴ（波形と網目の輪）を望遠鏡の縁に見立て、
       その内側の丸い窓に部員の映像を流す。窓の下に、実際の作品名が
       「観測ログ」として順番に流れる（押すとその作品へ）。 -->
  <figure class="scope" data-reveal-item>
    <div class="scope-lens" aria-hidden="true">
      <!-- 7.4MB。データ節約・動きを控える設定のときは下のスクリプトが止める -->
      <video id="bgv" autoplay muted loop playsinline preload="metadata" disablepictureinpicture>
        <source src="assets/video/computopia2.mp4" type="video/mp4">
      </video>
    </div>
    <span class="scope-ring" aria-hidden="true"></span>
    <figcaption class="scope-log" id="scope-log" hidden>
      <span class="scope-log-k">// 観測ログ</span>
      <a class="scope-log-w" id="scope-log-w" href="works.html"></a>
    </figcaption>
  </figure>

<p class="home-theme" aria-hidden="true">COMPUTER CLUB&nbsp;&nbsp;2026</p>

<script src="assets/js/site.js?v=20260923112532"></script>
<script src="assets/js/config.js?v=20260923112532"></script>
<script src="assets/js/data.js?v=20260923112532"></script>
<script>
(function () {
  var facts = document.getElementById('home-facts');
  /* ジャンル・日間は静的な数なので、出てきた瞬間に数え上げる。
     作品・制作者はデータが届いてから、同じ数え上げで差し替える。 */
  function countAll() {
    if (!window.CCMSite) return;
    [].forEach.call(facts.querySelectorAll('b'), function (b) {
      window.CCMSite.countTo(b, b.getAttribute('data-count'), 900);
    });
  }
  facts.addEventListener('transitionend', function once(e) {
    if (e.propertyName !== 'opacity') return;
    facts.removeEventListener('transitionend', once);
    countAll();
  });
  /* 動きを控える設定では transitionend が来ないので、すぐ数える */
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) countAll();

  var REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 開催までの日数。config.js の festival から、日本時間の「日付」で数える
     （時刻の差を割ると、前日の朝が「あと2日」になってしまうため）。 */
  var F = window.CCM && window.CCM.festival;
  var cnt = document.getElementById('home-count');
  if (F && cnt) {
    var now = Date.now(), s = Date.parse(F.start), e = Date.parse(F.end);
    var day = function (t) { return Math.floor((t + 9 * 3600000) / 86400000); };
    var dd = day(s) - day(now);
    cnt.textContent = now > e ? ' ── アーカイブ公開中'
                    : now >= s ? ' ── 開催中'
                    : dd <= 0 ? ' ── きょうから'
                    : dd === 1 ? ' ── あした開催'
                    : ' ── あと ' + dd + ' 日';
  }

  if (window.CCMData) {
    window.CCMData.load().then(function () {
      var f = facts.children;
      f[0].querySelector('b').setAttribute('data-count', window.CCMData.works.length);
      f[1].querySelector('b').setAttribute('data-count', window.CCMData.authors().length);
      if (window.CCMSite) countAll();
      startLog(window.CCMData.works);
    });
  }

  /* 観測ログ：作品名を順番に流す。押すとその作品が開く。 */
  function startLog(works) {
    var box = document.getElementById('scope-log');
    var a = document.getElementById('scope-log-w');
    var list = (works || []).filter(function (w) { return w && w.title && w.slug; });
    if (!box || !a || !list.length) return;
    for (var i = list.length - 1; i > 0; i--) {          /* 毎回ちがう順番で */
      var j = Math.floor(Math.random() * (i + 1)), t = list[i]; list[i] = list[j]; list[j] = t;
    }
    var k = 0;
    function put() {
      var w = list[k++ % list.length];
      a.textContent = w.title + (w.author ? '  ─  ' + w.author : '');
      a.href = 'works.html#w/' + encodeURIComponent(w.slug);
    }
    box.hidden = false;
    put();
    if (REDUCE) return;
    setInterval(function () {
      a.classList.add('swap');
      setTimeout(function () { put(); a.classList.remove('swap'); }, 260);
    }, 4200);
  }
  /* 映像が読めない環境では地の色に任せる。
     データ節約モードや「動きを減らす」設定の人には、そもそも流さない
     （止めて src を外すと、残りのダウンロードも止まる）。 */
  var v = document.getElementById('bgv');
  if (v) {
    var saveData = navigator.connection && navigator.connection.saveData;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (saveData || reduce) {
      v.pause();
      [].forEach.call(v.querySelectorAll('source'), function (s) { s.remove(); });
      v.removeAttribute('src');
      v.load();
      document.body.classList.add('no-video');
    } else {
      v.addEventListener('error', function () { document.body.classList.add('no-video'); }, true);
    }
  }
})();
</script>
