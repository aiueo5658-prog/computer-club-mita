<script>
(function () {
  var facts = document.getElementById('home-facts');
  /* ジャンル・日間は静的な数なので、出てきた瞬間に数え上げる。
     作品・制作者はデータが届いてから、同じ数え上げで差し替える。 */
  function countAll() {
    if (!window.CCMSite) return;
    [].forEach.call(facts.querySelectorAll('b'), function (b) {
      window.CCMSite.countTo(b, b.getAttribute('data-count'), 900);
    });
  }
  facts.addEventListener('transitionend', function once(e) {
    if (e.propertyName !== 'opacity') return;
    facts.removeEventListener('transitionend', once);
    countAll();
  });
  /* 動きを控える設定では transitionend が来ないので、すぐ数える */
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) countAll();

  if (window.CCMData) {
    window.CCMData.load().then(function () {
      var f = facts.children;
      f[0].querySelector('b').setAttribute('data-count', window.CCMData.works.length);
      f[1].querySelector('b').setAttribute('data-count', window.CCMData.authors().length);
      if (window.CCMSite) countAll();
    });
  }
  /* 映像が読めない環境では地の色に任せる */
  var v = document.getElementById('bgv');
  if (v) v.addEventListener('error', function () { document.body.classList.add('no-video'); });
})();
</script>
