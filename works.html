</head>
<body>

<noscript>
  <div class="noscript">
    <h1>三田国際科学学園 // 昆布観測島 作品展 2026</h1>
    <p>このページは JavaScript を使って作品を表示します。ブラウザの設定で JavaScript を有効にしてください。</p>
    <p>2026年10月31日(土)・11月1日(日) / 昆布観測島 展示教室</p>
  </div>
</noscript>

<!-- ===== 背景 ===== -->
<div class="bg" aria-hidden="true">
  <div class="limb"><i class="limb-glow"></i><i class="limb-core"></i></div>
  <div class="stars" id="stars"></div>
</div>

<!-- ===== ナビ ===== -->
<header class="nav">
  <a class="brand" href="index.html">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M16 2.6 28 9.3v13.4L16 29.4 4 22.7V9.3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M20.6 12.2a5.6 5.6 0 1 0 0 7.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="brand-txt">// 昆布観測島</span>
  </a>
  <nav class="nav-links">
    <a href="index.html">ホーム</a>
    <button type="button" data-home class="is-on" aria-current="page">作品一覧</button>
    <a href="map.html">マップ</a>
    <a href="qa.html">Q&amp;A</a>
  </nav>
  <div class="nav-end">
    <a class="cta" href="survey.html">アンケート</a>
  </div>
</header>

<!-- ===== 左：見出し ===== -->
<div class="hero" id="hero">
  <p class="hero-kick" id="hero-kick">ECLIPSE 2026</p>
  <h1 class="hero-title" id="hero-title">作品一覧</h1>
  <p class="hero-lede" id="hero-lede"></p>
  <button class="ghost hero-back" id="hero-back" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
    すべてのジャンルへ
  </button>
</div>

<!-- ===== 作品の配置（これひとつだけ） ===== -->
<main class="scene" id="scene">
  <div class="sys" id="sys">
    <div class="ringgrp" id="ringgrp">
      <i class="ring ghost" data-r="0.58"></i>
      <i class="ring ghost" data-r="0.78"></i>
      <i class="ring ghost" data-r="1.27"></i>
      <i class="ring" data-r="1"></i>
      <i class="ec" data-d="0.95"></i>
      <i class="ec" data-d="0.78"></i>
      <i class="ec ec-rim" data-d="0.62"></i>
      <i class="ec ec-disc" data-d="0.48"></i>
      <!-- 部のロゴ。白い三日月がそのまま日食の光の縁になる。 -->
      <i class="ec ec-logo" data-d="0.70" role="img" aria-label="コンピュータ部のロゴ"></i>
      <span class="ec-cap">ECLIPSE</span>
    </div>
    <!-- 中身は app.js が組み立てます -->
  </div>
</main>

<!-- ===== 右：作品リスト ===== -->
<aside class="side off" id="side">
  <p class="side-kick" id="side-kick"></p>
  <p class="side-title" id="side-title"></p>
  <p class="side-count" id="side-count"></p>
  <div class="side-list" id="side-list"></div>
</aside>

<!-- ===== 使い方ガイド ===== -->
<div class="guide" id="guide">
  <div class="guide-brand">
    <span class="guide-mark" aria-hidden="true"><i></i><b></b><u></u></span>
    <span>
      <span class="guide-kick">GUIDE</span>
      <span class="guide-name">使い方ガイド</span>
    </span>
  </div>
  <div class="guide-step"><span class="guide-no">01</span><b>ジャンルを選ぶ</b>
    <p>まるい絵をクリックすると、そのジャンルに入ります。</p></div>
  <div class="guide-step"><span class="guide-no">02</span><b>左右に引いて回す</b>
    <p>作品がぐるりと並びます。画面を横に引くと回ります。</p></div>
  <div class="guide-step"><span class="guide-no">03</span><b>その場で遊ぶ</b>
    <p>Scratch も映像も音楽も、全画面で楽しめます。</p></div>
</div>

<button class="camreset" id="camreset" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  カメラをリセット
</button>

<!-- ===== 全画面再生 ===== -->
<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-labelledby="p-title">
  <!-- 作品を開いた直後、ハートの数が裏側から届くまでの間だけ覆う。
       数字だけが後から遅れてポツンと現れるとバグって見えるため、
       用意ができるまでは丸ごと隠しておき、揃ってから一度に出す。 -->
  <div class="player-loading" id="p-loading" hidden aria-hidden="true"><span class="loading-ring"></span></div>
  <div class="player-bar">
    <button class="ghost" id="p-close" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
      一覧へ戻る
    </button>
    <div class="player-id">
      <span class="player-kick" id="p-kick"></span>
      <b id="p-title"></b>
    </div>
    <div class="player-acts">
      <div class="like-wrap">
        <button class="like-btn" id="p-like" type="button" aria-pressed="false" aria-label="いいね">
          <svg class="like-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20.7C7 17.2 3 13.7 3 9.4 3 6.4 5.3 4 8.3 4c1.8 0 3.2 1 3.7 2.3C12.5 5 13.9 4 15.7 4 18.7 4 21 6.4 21 9.4c0 4.3-4 7.8-9 11.3z"/>
          </svg>
          <i class="like-burst" aria-hidden="true"></i>
        </button>
        <span class="like-n" id="p-like-n" aria-hidden="true"></span>
      </div>
      <!-- ひとこと。裏側(config.js の apiUrl)が未設定なら丸ごと隠れる。 -->
      <button class="cmt-toggle" id="cmt-toggle" type="button" hidden
              aria-haspopup="true" aria-expanded="false" aria-controls="cmt-panel" aria-label="ひとこと">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        <span class="cmt-badge" id="cmt-badge" aria-hidden="true"></span>
      </button>
      <span class="player-by" id="p-by"></span>
      <a class="ghost" id="p-ext" href="#" target="_blank" rel="noopener noreferrer" hidden>元のページ</a>
    </div>
  </div>
  <div class="player-stage" id="p-stage"></div>
  <div class="player-foot">
    <p id="p-desc"></p>
    <div class="player-steps">
      <button class="ghost" id="p-prev" type="button">前の作品</button>
      <button class="ghost" id="p-next" type="button">次の作品</button>
    </div>
  </div>

  <!-- ひとこと。右上のアイコン(#cmt-toggle)を押したときだけ滑り出す。
       フッターの行に混ぜていた頃は、フォームや一覧の高さぶん
       前後の作品ボタンまで動いてレイアウトが崩れていたため、
       独立したフローティングカードに切り出した。 -->
  <aside class="cmt-panel" id="cmt-panel" aria-hidden="true">
    <div class="cmt-head">
      <h3 class="cmt-title">ひとこと</h3>
      <span class="cmt-count" id="cmt-count"></span>
      <button class="cmt-panel-close" id="cmt-panel-close" type="button" aria-label="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <form class="cmt-form" id="cmt-form">
      <input class="cmt-name" id="cmt-name" type="text" maxlength="20"
             placeholder="なまえ（任意）" autocomplete="nickname">
      <input class="cmt-text" id="cmt-text" type="text" maxlength="200"
             placeholder="感想・質問・改善のアイデアをひとこと" required>
      <button class="cta cmt-send" id="cmt-send" type="submit">送る</button>
    </form>
    <p class="cmt-rule">辛口の指摘も歓迎です。人を傷つける書き方のものは載りません。</p>
    <p class="cmt-note" id="cmt-note" role="status"></p>
    <ul class="cmt-list" id="cmt-list"></ul>
  </aside>
</div>

<!-- ===== アイコンの版下 ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 15V9M8 18V6M12 16V8M16 19V5M20 14v-4"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.4"/><path d="M3 9h18M3 15h18M8 4.5v15M16 4.5v15"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m8.5 8-4.5 4 4.5 4M15.5 8l4.5 4-4.5 4"/></symbol>
  <symbol id="i-model" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8.4v7.2l-9 4.9-9-4.9V8.4l9-4.9z"/><path d="m3 8.4 9 4.9 9-4.9M12 13.3v7.2"/></symbol>
  <symbol id="i-other" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></symbol>
</svg>

<iframe name="gform-sink" title="form sink" style="display:none" aria-hidden="true"></iframe>

</body>
